name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
    paths: [src/**]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: acrmicrohttpchallenge
  RESOURCE_GROUP: rg-microhttpchallenge

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: microhttp-auth
            context: src/MicroHttp.Auth
            app: microhttp-auth
          - service: microhttp-register
            context: src/MicroHttp.Register
            app: microhttp-register
          - service: microhttp-compete
            context: src/MicroHttp.Compete
            app: microhttp-compete

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push Docker image
        run: |
          IMAGE=${{ env.ACR_NAME }}.azurecr.io/${{ matrix.service }}
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest ${{ matrix.context }}
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name ${{ matrix.app }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ matrix.service }}:${{ github.sha }}
